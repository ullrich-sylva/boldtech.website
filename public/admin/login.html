<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administrateur — BOLDTECH</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-header">
      <img src="/assets/images/logo.png" alt="BOLD TECH" class="admin-logo">
      <h2>Espace Administration</h2>
      <p>Veuillez entrer votre mot de passe pour accéder au tableau de bord.</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="password">Mot de passe administrateur</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" placeholder="Mot de passe" required>
          <button type="button" id="togglePassword" class="toggle-password-btn">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="loginError" class="login-error-message"></div>

      <button type="submit" class="btn btn-submit">
        <i class="fas fa-sign-in-alt"></i> Se connecter
      </button>
    </form>
    
    <div class="login-footer">
      <a href="../"><i class="fas fa-arrow-left"></i> Retour au site vitrine</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('adminToken');
      if (token) {
        // Simple check if token exists, redirect to dashboard.
        window.location.href = 'dashboard.html';
      }

      const loginForm = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('togglePassword');
      const loginError = document.getElementById('loginError');

      // Toggle password visibility
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePasswordBtn.querySelector('i').classList.toggle('fa-eye');
        togglePasswordBtn.querySelector('i').classList.toggle('fa-eye-slash');
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const password = passwordInput.value;

        loginError.style.display = 'none';

        fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password })
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            localStorage.setItem('adminToken', data.token);
            window.location.href = 'dashboard.html';
          } else {
            loginError.textContent = data.message || 'Mot de passe incorrect.';
            loginError.style.display = 'block';
          }
        })
        .catch(err => {
          console.error(err);
          loginError.textContent = 'Impossible de se connecter au serveur.';
          loginError.style.display = 'block';
        });
      });
    });
  </script>
</body>
</html>
